name: Preserve complete V5.2 mobile player visual proof
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: timeout 120 npm install --prefix .qa --no-save playwright@1.64.0
      - run: node tests/v52-mobile-proof.mjs
      - name: Save independent mobile evidence without replacing full playback proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(python3 -c "import json; print(next(x['url'].split('/')[-2] for x in json.load(open('videos.json')) if x['id']=='v52-technical'))")
          zip -q "v52-mobile-proof-${GITHUB_RUN_ID}.zip" v52-mobile-proof.json qa/*.png
          gh release upload "$tag" "v52-mobile-proof-${GITHUB_RUN_ID}.zip"
