name: Verify Braincell V5.3 public preview and V4 V5 V5.1 V5.2 regression
on:
  push:
    branches: [main]
    paths: [review-v53-request.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Provision lightweight browser tester on cloud only
        run: |
          google-chrome --version
          timeout 120 npm install --prefix .qa --no-save playwright@1.64.0
      - name: Verify actual deployed player including range, seek, AAC and full V5.3 playback and fullscreen
        run: node tests/v53-preview.mjs
      - name: Preserve browser proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(python3 -c "import json; print(next(x['url'].split('/')[-2] for x in json.load(open('videos.json')) if x['id']=='v53-technical'))")
          zip -q "v53-browser-proof-${GITHUB_RUN_ID}.zip" v53-playback-test.json qa/*.png
          gh release upload "$tag" "v53-browser-proof-${GITHUB_RUN_ID}.zip"
          gh release upload "$tag" v53-playback-test.json qa/*.png --clobber



